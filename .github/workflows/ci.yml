name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-core:
    name: GAR v0.1 Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build and test Paper runtime guard
        run: make paper-guard-verify

  backend:
    name: Python 3.12 tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create the project Conda environment
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: guarded-agent-runner
          environment-file: environment.yml
          auto-activate-base: false
      - name: Verify Python version
        run: python --version
      - name: Lint backend and tests
        run: ruff check guarded_agent_runner tests
      - name: Run backend test suite
        run: python -m pytest -q

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix frontend ci
      - name: Type-check and build
        run: npm --prefix frontend run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [go-core, backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the runtime image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: guarded-agent-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container health endpoint
        run: |
          docker run --rm -d --name guarded-agent-runner-ci -p 18080:8000 guarded-agent-runner:ci
          trap 'docker logs guarded-agent-runner-ci; docker rm -f guarded-agent-runner-ci >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/health
