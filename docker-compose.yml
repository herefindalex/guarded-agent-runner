services:
  runner:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - runner-data:/data
    environment:
      DATABASE_URL: sqlite:////data/guarded_agent_runner.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 2s
      retries: 5

volumes:
  runner-data:

