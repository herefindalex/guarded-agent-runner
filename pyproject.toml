[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-agent-runner"
version = "0.1.0"
description = "A fail-closed reference MVP for capability-scoped agent execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["guarded_agent_runner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
